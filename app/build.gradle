plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.pulsefit.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pulsefit.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-alpha"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = localProperties.getProperty("MAPS_API_KEY", "REPLACE_ME")

        // API keys below are read from local.properties (git-ignored) and exposed as
        // BuildConfig fields, e.g. OPENWEATHER_API_KEY=abcdef123456 — see README.
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${localProperties.getProperty('OPENWEATHER_API_KEY', 'REPLACE_ME')}\""
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${localProperties.getProperty('MAPS_API_KEY', 'REPLACE_ME')}\""
        buildConfigField "String", "EDAMAM_APP_ID", "\"${localProperties.getProperty('EDAMAM_APP_ID', 'REPLACE_ME')}\""
        buildConfigField "String", "EDAMAM_APP_KEY", "\"${localProperties.getProperty('EDAMAM_APP_KEY', 'REPLACE_ME')}\""
        buildConfigField "String", "EXERCISEDB_API_KEY", "\"${localProperties.getProperty('EXERCISEDB_API_KEY', 'REPLACE_ME')}\""

        // Web client ID for Google Sign-In (NOT the same as the Android API key). Get it
        // from Firebase Console > Authentication > Sign-in method > Google > Web SDK
        // configuration, after re-downloading google-services.json. Using a BuildConfig
        // field here (rather than the auto-generated default_web_client_id resource)
        // means the project still compiles before you've set this up.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${localProperties.getProperty('GOOGLE_WEB_CLIENT_ID', 'REPLACE_ME')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core / UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Firebase (BoM manages versions). Recent BoM releases merged the Kotlin
    // extensions into the base artifacts, so no separate "-ktx" packages are needed.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Room (offline-first local cache). 2.6.1 has a known KSP2 bug processing suspend
    // DAO query methods ("unexpected jvm signature V"); fixed from 2.7.2 onward.
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // WorkManager (background sync)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Networking (external REST APIs: weather, exercise, nutrition, custom backend)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Provides Task<T>.await() used throughout data/repository/ to bridge Firebase's
    // Task-based API to suspend functions.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    // Maps
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Security (encrypted local prefs)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Swipe refresh / recyclerview
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
